name: Build and publish blogdown site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  HUGO_VERSION: '0.147.9'
  TZ: America/Vancouver
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Set up Pandoc for optional R Markdown posts
        uses: r-lib/actions/setup-pandoc@v2
      - name: Install blogdown
        run: Rscript -e 'install.packages("blogdown", repos = "https://cloud.r-project.org")'
      - name: Install the pinned Hugo version
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o "${RUNNER_TEMP}/hugo.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"
      - name: Compile any R Markdown posts
        run: Rscript -e 'blogdown::build_site(run_hugo = FALSE, build_rmd = TRUE)'
      - name: Build for this repository URL
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --baseURL "${SITE_BASE_URL}/"
      - name: Check public links and assets
        run: python3 scripts/check_site.py public
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
